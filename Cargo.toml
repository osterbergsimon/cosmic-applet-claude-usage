[package]
name = "cosmic-applet-claude-usage"
version = "0.1.0"
edition = "2021"
description = "Minimal COSMIC panel applet showing Claude Code usage"
repository = "https://github.com/osterbergsimon/cosmic-applet-claude-usage"
license = "GPL-3.0-only"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
dirs = "5"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
# Pinned to libcosmic master HEAD at the time the pop-os/cosmic-applet-template
# (which tracks master, unpinned) was cloned for this scaffold.
rev = "e7f37f3e817a13b81f63266df98f2528ef608eaf"
default-features = false
features = ["applet", "tokio", "wayland", "multi-window", "winit"]
